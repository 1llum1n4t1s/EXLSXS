name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Verify Velopack library and vpk CLI versions match
        run: |
          # Dependabot はホスト csproj の Velopack だけを上げるため、pack 用の vpk 固定版と揃っているかをここで止める。
          $library = ([xml](Get-Content -LiteralPath EXLSXS.Host/EXLSXS.Host.csproj -Raw)).SelectSingleNode('//PackageReference[@Include="Velopack"]').GetAttribute('Version')
          $cli = [regex]::Match((Get-Content -LiteralPath build/pack-velopack.ps1 -Raw), '(?m)^\$vpkVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($library) -or $library -ne $cli) { throw "Velopack library ($library) and vpk CLI ($cli) must be updated together." }
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Restore
        run: |
          dotnet restore EXLSXS.Host/EXLSXS.Host.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build EXLSXS.Host/EXLSXS.Host.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test --project EXLSXS.Host.Tests/EXLSXS.Host.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build VSTO add-in with Office developer tools
        run: |
          # 配布用の秘密鍵を使わず、CI内だけの短命証明書でVSTOのmanifest生成と署名を検証する。
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=EXLSXS Dependency Validation" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TeamOffice -property installationPath
          if (-not $installation) { throw "Visual Studio Office developer tools are required to validate the VSTO add-in." }
          $msbuild = Join-Path $installation "MSBuild/Current/Bin/MSBuild.exe"
          $vsVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TeamOffice -property installationVersion).Split(".")[0] + ".0"
          & $msbuild EXLSXS/EXLSXS.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /p:VisualStudioVersion=$vsVersion /p:SignManifests=true /p:SignAssembly=false "/p:ManifestCertificateThumbprint=$($certificate.Thumbprint)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
