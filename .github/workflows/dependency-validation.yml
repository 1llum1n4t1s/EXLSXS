name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore EXLSXS.Host/EXLSXS.Host.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build EXLSXS.Host/EXLSXS.Host.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test --project EXLSXS.Host.Tests/EXLSXS.Host.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build VSTO add-in with Office developer tools
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.OfficeDeveloperTools -property installationPath
          if (-not $installation) { throw "Visual Studio Office developer tools are required to validate the VSTO add-in." }
          $msbuild = Join-Path $installation "MSBuild/Current/Bin/MSBuild.exe"
          $vsVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.OfficeDeveloperTools -property installationVersion).Split(".")[0] + ".0"
          & $msbuild EXLSXS/EXLSXS.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /p:VisualStudioVersion=$vsVersion /p:SignManifests=false /p:SignAssembly=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
