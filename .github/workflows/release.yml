name: Release

# 署名付き Velopack リリースを GitHub Actions で作り、R2 (exlsxs.kagayoi.com) へ配信する。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune, 1.1.0 以降) が Certum SimplySign のクラウド鍵で、
#   Authenticode 署名と VSTO の ClickOnce マニフェスト署名を行う。本人の PC や SimplySign Desktop は不要。
# - 起動: 手動 (workflow_dispatch)。/vava で版を上げて push した後に、リリースしたいブランチを指定して実行する。
#   誤配信を避けるため push / tag では自動起動しない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す。
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  release:
    # VSTO のビルドには Visual Studio の Office 開発ツールが要る (dependency-validation.yml と同じランナー)。
    runs-on: windows-2022
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # 11.0.x はホストの TargetFramework (net11.0) 用。10.0.x は vpk CLI (net10.0 までのツール) を
          # ロールフォワードに頼らず動かすために残す。vpk が net11.0 を同梱したら 10.0.x を外せる。
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Office 開発ツールを確認
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TeamOffice -property installationPath
          if (-not $installation) { throw 'Visual Studio の Office 開発ツールが見つかりません。' }
          Write-Host "Visual Studio: $installation"

      - name: Sigilune を導入
        # 1llum1n4t1s/Sigilune@v1.1.1 (署名シークレットを扱うジョブなので、他と同じくコミット SHA で固定する)
        uses: 1llum1n4t1s/Sigilune@b087dc7eb2e144559680d60442f198f58e031d0c

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exlsxs-release-packages
          path: artifacts/velopack-releases/*
          if-no-files-found: warn
          retention-days: 7
